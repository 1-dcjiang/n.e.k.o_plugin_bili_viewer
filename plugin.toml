[plugin]
id = "bili_viewer"
name = "B站全能助手"
description = "让 YUI 浏览、感知并管理哔哩哔哩：搜索视频/直播/用户，查看视频详情（标题/UP主/时长/播放/弹幕/点赞/分P/标签）、弹幕文本、CC 字幕、B站官方 AI 概要、视频评论，查看直播间信息与实时弹幕（匿名采集），查看 UP主信息与投稿列表；可感知用户当前正在看/用的内容（前台窗口通用感知，识别应用/站点/页面主题，B站视频/直播自动匹配详情）；支持管理自己的账号与稿件（查看/改标题简介标签）。v0.7.12 全盘复查优化：修复声音采样率隐患（AudioContext 不支持 16k 构造参数时按实际采样率写 wav 头与推送字段，ASR 不再听到变速内容）；扩展内核过旧（Chromium<109 无 offscreen）时声音能力自动降级静默跳过、不影响其余功能；登录态自愈加重绑冷却（60s），避免连环失败反复触发后台探测；扩展三包升级 0.2.6，JS 语法、manifest 结构、190 项测试、ruff、check 全量复验通过。v0.7.11 让 YUI 能真正'看到+听到'：浏览器扩展新增声音捕获（Chrome/Edge/360 三包 0.2.5，popup 一次性开启后后台静默采集 B站 标签页音频，开关记忆重启自动恢复），声音分段 wav 直推本机插件，本地 faster-whisper ASR 转文字后经 bili_listen_audio 静默注入 YUI（全本地处理不上外网）；配合既有扩展画面截图（bili_see_screen）与页面 DOM 实况，YUI 可自主理解视频/直播内容并行动；网络层自动重试+写操作随机抖动防拦截（网络错误/超时/5xx 自动退避重试，高频写请求时间抖动降低被风控概率）；登录态失效自动自愈（写操作 AUTH_FAILED 时后台触发重绑，扩展在线自动同步新登录态）；桌面投放扩展包同步新增 offscreen 声音采集文件。v0.7.10 双账号分清大小号：绑定流程按登录顺序自动归位——第一个登录的账号=大号（main），第二个登录的账号=小号（yui，默认操作账号），持久化到插件目录 main_cookie.txt/yui_cookie.txt 并记录账号角色映射（accounts.json）；新增 bili_accounts（大小号昵称/uid/绑定时间/默认角色视图，YUI 随时分清大小号）与 bili_set_roles（后期说明修改：交换大小号角色或按 uid 指定角色，仅文件层绑定账号可互换，env 优先时提示手动）；CDP/扩展/面板三个绑定通道全部走统一归位逻辑。v0.7.9 默认小号统一规则：未说明用哪个账号时所有账号维度操作一律默认走 YUI 小号（小号未配置自动回退主账号），账号解析统一 _resolve_account，bili.py 底层 edit_video/my_info/my_videos 支持 account 参数默认 yui。v0.7.8 大号小号并发防打架：小号写操作节流锁内原子占用消除并发双发、失败自动回退、投稿进行中互斥（BUSY）、凭证完全按账号隔离。v0.7.7 三扩展命名对称；v0.7.6 稿件修改/投稿提交补 wbi 签名；v0.7.5 桌面投放三扩展压缩包；v0.7.4 扩展按浏览器拆分三包独立；v0.7.3 动态 wbi 签名、Cookie mtime 缓存、-101 归口；v0.7.1 独立小号后台化（同步+自主行动，静默不抢界面、仅权限问题求助）；自主行动节流：弹幕 60s/目标、评论 120s/目标、动态 6 条/日、投稿 2 条/日、风控自动退避。绑定 CDP 运行时接入，Cookie 仅本地使用不上传不写日志。"
short_description = "让 YUI 浏览、感知并管理 B站：搜索/视频详情/弹幕/字幕/AI概要/评论/直播弹幕/UP主/稿件管理/发弹幕/写评论/发动态/投稿/独立小号后台自主运营（第一个登录=大号、第二个登录=小号，YUI 分清大小号，可后期互换）/感知当前观看/扩展直连自动绑定（Chrome/Edge/360 三浏览器专用扩展，桌面自动投放三扩展压缩包）/声音感知：扩展后台采集 B站 标签页声音，本地 ASR 转文字让 YUI 听到直播与视频（全本地处理，采样率自适应）+网络重试与写操作抖动防拦截+AUTH_FAILED 自动重绑自愈（含冷却，v0.7.12 全盘复查修复版）"
keywords = ["bilibili", "哔哩哔哩", "B站", "视频", "弹幕", "评论", "直播", "字幕", "AI概要", "UP主", "搜索", "bili", "danmaku", "live", "感知", "now_watching", "稿件", "发弹幕", "写评论", "动态", "投稿", "独立小号", "YUI运营", "自主行动", "后台静默", "不抢界面", "同步行动", "当前观看", "CDP", "自动绑定", "cookie", "浏览器扩展", "bili-bridge", "bili-bridge-chrome", "接入桥", "直连", "实时监控", "标签页感知", "Edge扩展", "360浏览器", "360极速", "360安全", "chrome扩展", "桌面投放", "zip压缩包", "三扩展", "wbi签名", "并发", "原子占用", "防重复", "大号小号", "默认小号", "默认账号", "account", "双账号", "绑定顺序", "分清大小号", "交换角色", "bili_accounts", "bili_set_roles", "accounts.json", "main_cookie"]
version = "0.7.12"
type = "plugin"
entry = "plugin.plugins.bili_viewer:BiliViewerPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

