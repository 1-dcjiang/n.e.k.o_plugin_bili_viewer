[plugin]
id = "bili_viewer"
name = "B站全能助手"
description = "让 YUI 浏览、感知并管理哔哩哔哩：搜索视频/直播/用户，查看视频详情（标题/UP主/时长/播放/弹幕/点赞/分P/标签）、弹幕文本、CC 字幕、B站官方 AI 概要、视频评论，查看直播间信息与实时弹幕（匿名采集），查看 UP主信息与投稿列表；可感知用户当前正在看/用的内容（前台窗口通用感知，识别应用/站点/页面主题，B站视频/直播自动匹配详情）；支持管理自己的账号与稿件（查看/改标题简介标签）。v0.7.3 复查优化：动态发布接口补 wbi 签名（缺失会被 B站 -403/-352 拒绝）、小号 Cookie 文件 mtime 缓存（后台轮询不再频繁读盘）、GET 层未登录 -101 统一归口、投稿 multipart 文件名清洗（防边界破坏）、Chrome 启动失败自动试 Edge、面板/绑定状态不再重复 CDP 探测。v0.7.2 热门拉取 60s 缓存；v0.7.1 独立小号完全后台化：配置独立小号 Cookie（BILI_YUI_COOKIE 或插件目录 yui_cookie.txt）后，YUI 可用独立账号与你同步行动（后台跟随到同一直播间/视频）并自行行动（理解内容后自主发弹幕、写评论、发动态、投稿视频，除非权限问题否则不打扰你）；写操作默认走小号、与你的主账号严格隔离（未配置小号时自动回退主账号）；自主行动与内容同步一律后台静默注入（read，不弹气泡、不主动开口、不打断玩家界面），行动成功不播报，仅权限/风控类问题才在自然对话中求助；自主行动受节流保护（弹幕 60s/目标、评论 120s/视频、动态 6 条/日、投稿 2 条/日、热门拉取 60s 缓存），投稿分片间限速不占满带宽，风控错误自动退避，内容自然不刷屏。登录态绑定采用 CDP 运行时接入：直接读取正在运行的浏览器（Chrome/Edge）中的 B站登录态，无需关闭浏览器，也不要求手动复制 Cookie；Cookie 仅本地使用，不上传、不写日志。"
short_description = "让 YUI 浏览、感知并管理 B站：搜索/视频详情/弹幕/字幕/AI概要/评论/直播弹幕/UP主/稿件管理/发弹幕/写评论/发动态/投稿/独立小号后台自主运营（不打断玩家）/感知当前观看/扩展直连自动绑定"
keywords = ["bilibili", "哔哩哔哩", "B站", "视频", "弹幕", "评论", "直播", "字幕", "AI概要", "UP主", "搜索", "bili", "danmaku", "live", "感知", "now_watching", "稿件", "发弹幕", "写评论", "动态", "投稿", "独立小号", "YUI运营", "自主行动", "后台静默", "不抢界面", "同步行动", "当前观看", "CDP", "自动绑定", "cookie", "浏览器扩展", "bili-bridge", "接入桥", "直连", "实时监控", "标签页感知"]
version = "0.7.3"
type = "plugin"
entry = "plugin.plugins.bili_viewer:BiliViewerPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
