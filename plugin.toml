[plugin]
id = "bili_viewer"
name = "B站全能助手"
description = "让 YUI 浏览、感知并管理哔哩哔哩：搜索视频/直播/用户；查看视频详情（标题/UP主/播放/弹幕/分P/标签）、弹幕文本、CC字幕、AI概要、评论、直播间信息与实时弹幕、UP主信息与投稿列表；感知用户当前正在看/用的内容（前台窗口通用感知，B站视频/直播自动匹配详情）；管理账号与稿件（改标题/简介/标签）；发弹幕/评论/动态、投稿。声音感知：系统音频桥（WASAPI loopback 全自动采集系统输出声音，首次调用 bili_listen_audio 时按需启动，不常驻监听整机），浏览器扩展链路兜底，YUI 真正听到直播/视频声音。账号双分离（第一个登录=大号 main，第二个=小号 yui；未指定账号时已绑小号走小号，只有一个账号走主号）；写操作/感知全程机器级静默，成功后只回标准短句（如'弹幕已发送。'），无'搞定啦'类话术。v0.7.50 真实发送验证：评论发送后回读评论区确认可见（防 B站 接口 code=0 假成功），弹幕要求返回 dmid 才确认成功；接口接受但不验证到一律返回错误、严禁声称已发送。v0.8.0 bili-cli 精华：收件箱（未读/回复/@/赞/系统通知/未读私信一次看完）、私信（会话/读/发，白名单护栏+500字上限+回读验证）、表态（点赞/投币/收藏/三连，投币每视频≤2+每日≤5+回读验证）、我的收藏夹、热门榜单（分区/每周必看/入站必刷）、创作数据（播放/互动/粉丝）、本地限流+审计日志+错误码分类提示。v0.8.5 私信接口 wbi 签名修复：fetch_session_msgs/send_msg 按官方定义补 wts+w_rid（防 -412 风控），创作中心接口对齐 verify-only"
short_description = "v0.9.46 A795 增量深审：① bili_set_roles 的大小号互换整段纳入 _ACCOUNTS_LOCK，避免扩展刷新与角色互换交叉导致 Cookie/角色表串号；同步文件+DPAPI 改走 asyncio.to_thread，不阻塞事件循环。② 绑定流程四处 write_*_cookie_file 改用 strict=True，磁盘/权限失败直接中止，不再先报“已绑定”。③ 角色表写失败时接住回滚结果，回滚也失败会明确提示文件可能已互换。④ _read_response 增加 16 MiB 响应上限，gzip 弹幕用有界解压；cdp_cookie._http_json 用 with 关闭连接。新增 6 项离线回归，全量 417 项通过。真实 B站、Cookie、CDP、扩展实机与写操作未执行。"

keywords = ["bilibili", "哔哩哔哩", "B站", "视频", "弹幕", "评论", "直播", "字幕", "AI概要", "UP主", "搜索", "bili", "danmaku", "live", "感知", "now_watching", "稿件", "发弹幕", "写评论", "动态", "投稿", "独立小号", "YUI运营", "自主行动", "后台静默", "不抢界面", "同步行动", "当前观看", "CDP", "自动绑定", "cookie", "浏览器扩展", "bili-bridge", "bili-bridge-chrome", "接入桥", "直连", "实时监控", "标签页感知", "Edge扩展", "360浏览器", "360极速", "360安全", "chrome扩展", "桌面投放", "zip压缩包", "三扩展", "wbi签名", "并发", "原子占用", "防重复", "大号小号", "默认小号", "默认账号", "account", "双账号", "绑定顺序", "分清大小号", "交换角色", "bili_accounts", "bili_set_roles", "accounts.json", "main_cookie", "收件箱", "私信", "投币", "点赞", "收藏", "三连", "每日上限", "护栏", "审计", "限流", "bili-cli", "inbox", "dm", "coin", "favorite", "triple", "榜单", "每周必看", "入站必刷", "创作数据", "直播间观众", "活跃观众", "关注观众", "live_viewers", "人气", "去重", "DYN_DUP", "DM_DUP", "指令桥", "command_doubao", "doubao_bridge", "命令豆包", "指令原文", "INSTRUCTION_AS_CONTENT"]
version = "0.9.46"
type = "plugin"
entry = "plugin.plugins.bili_viewer:BiliViewerPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

