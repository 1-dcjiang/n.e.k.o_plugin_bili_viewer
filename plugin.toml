[plugin]
id = "bili_viewer"
name = "B站全能助手"
description = "让 YUI 浏览、感知并管理哔哩哔哩：搜索视频/直播/用户；查看视频详情（标题/UP主/播放/弹幕/分P/标签）、弹幕文本、CC字幕、AI概要、评论、直播间信息与实时弹幕、UP主信息与投稿列表；感知用户当前正在看/用的内容（前台窗口通用感知，B站视频/直播自动匹配详情）；管理账号与稿件（改标题/简介/标签）；发弹幕/评论/动态、投稿。声音感知：系统音频桥（WASAPI loopback 全自动采集系统输出声音，启动即常驻，无需浏览器授权/快捷键）优先，浏览器扩展链路兜底，YUI 真正听到直播/视频声音。账号双分离（第一个登录=大号 main，第二个=小号 yui 默认操作账号）；写操作/感知全程机器级静默，成功后只回标准短句（如'弹幕已发送。'），无'搞定啦'类话术。v0.7.50 真实发送验证：评论发送后回读评论区确认可见（防 B站 接口 code=0 假成功），弹幕要求返回 dmid 才确认成功；接口接受但不验证到一律返回错误、严禁声称已发送。v0.8.0 bili-cli 精华：收件箱（未读/回复/@/赞/系统通知/未读私信一次看完）、私信（会话/读/发，白名单护栏+500字上限+回读验证）、表态（点赞/投币/收藏/三连，投币每视频≤2+每日≤5+回读验证）、我的收藏夹、热门榜单（分区/每周必看/入站必刷）、创作数据（播放/互动/粉丝）、本地限流+审计日志+错误码分类提示。v0.8.5 私信接口 wbi 签名修复：fetch_session_msgs/send_msg 按官方定义补 wts+w_rid（防 -412 风控），创作中心接口对齐 verify-only"
short_description = "让 YUI 浏览/感知/管理 B站：搜索、详情、弹幕、字幕、AI概要、评论、直播、UP主、稿件、发弹幕/评论/动态/投稿、大小号运营、系统音频桥听声音（全自动无需浏览器授权）；v0.9.24 run入口新增批量点赞（action=like&mid=UP主uid，默认小号点赞，5秒风控间隔逐条真实点赞+回读验证，单次最多8个，如实转述已点/未点成，NO_ACTION输出明确禁止编造风控/假成功，感知通知防复述原文，账号刷新同步accounts防角色错位）；v0.9.23 全量复查修复评论目标解析账号硬编码（bili_reply_comment 原固定 account=yui 解析 BV 号，只有主账号的用户评论会失败——改用实际账号解析）+ 全量核对 57 个工具（写操作：评论/表态/投稿/编辑/关注/取关/绑定/角色全部有回读验证或护栏；读操作与感知完整）；v0.9.22 全盘复盘加写操作短窗去重（动态发布同内容60秒内重复→DYN_DUP、私信发送同对象同内容60秒内重复→DM_DUP，接口接受即记录，杜绝'发一次变3条'与私信重复发送，工具描述同步告知YUI去重错误不重试）；v0.9.21 私信回复注入强化'直接回复对方本人'铁律（用户实证：对方问'你喜欢干什么'，YUI 先问用户怎么回、差点路由到连发888弹幕、把答案只复述给用户、最后用'刚才正说到…'复述式开场——注入现明确：私信回复任务只用 bili_dm_send 发给对方本人，严禁只对用户复述/先问用户/路由弹幕/复述式开场，用户说'你自己决定'就自己决定）；v0.9.20 感知工具每次询问自动重新检测（_ext_tab 加 force：检测直播间/视频每次调用强制重新检测当前浏览器页面并实时查询接口，不再受120秒新鲜窗口影响）；v0.9.19 明确告知YUI'拿不到dmid是B站直播弹幕接口常态，非错误非失败，严禁纠结，判定只看回读验证'；v0.9.18 弹幕回读验证防假成功（用户实证：接口code=0无dmid但直播间不显示，B站会静默吞弹幕——发送后回读ajax/msg最近弹幕，确认自己uid+文本出现才算已发，未确认如实上报DANMAKU_UNCONFIRMED并停止，连发任务同样回读确认才计sent、未确认立即停止）；v0.9.17 连发间隔强制最小5秒（B站实际风控5秒）；v0.9.16 直播弹幕无dmid视为已发出（接口常态不返回回流ID但弹幕多数正常发出）；v0.9.15 弹幕连发任务（bili_live_danmaku_loop后台自动连发，配stop/status，无需逐条指令，解决'不会自动发挂机'）；v0.9.14 弹幕重试等待对齐5秒；v0.9.13 弹幕'很可能已发出'；v0.9.12 直播弹幕节流放宽至5秒；v0.9.11 粉丝列表工具bili_fans_list；v0.9.10 修复主账号Cookie误配成小号+私信白名单扩展支持全部粉丝+私信注入带真实uid；v0.9.9 修复动态发布假成功；v0.9.8 修复动态删除假成功；v0.9.7 修复直播弹幕假成功；v0.9.6 全盘复查：修复4处account路由；v0.9.5 修复动态发布假失败；v0.9.4 修复私信自动检测与自动回复；v0.9.3 修复动态内容被包成JSON；v0.9.2 修复私信发送假失败；v0.9.1 修复私信查询工具路由；v0.9.0 私信自主检测直读内容；v0.8.9 视频详情支持操作账号cookie；v0.8.8 动态发布接口修复；v0.8.7 直播定位纠偏；v0.8.5 私信wbi签名修复；v0.8.0 收件箱/私信/点赞投币收藏三连；v0.7.50 评论回读验证/弹幕dmid校验防假成功"
keywords = ["bilibili", "哔哩哔哩", "B站", "视频", "弹幕", "评论", "直播", "字幕", "AI概要", "UP主", "搜索", "bili", "danmaku", "live", "感知", "now_watching", "稿件", "发弹幕", "写评论", "动态", "投稿", "独立小号", "YUI运营", "自主行动", "后台静默", "不抢界面", "同步行动", "当前观看", "CDP", "自动绑定", "cookie", "浏览器扩展", "bili-bridge", "bili-bridge-chrome", "接入桥", "直连", "实时监控", "标签页感知", "Edge扩展", "360浏览器", "360极速", "360安全", "chrome扩展", "桌面投放", "zip压缩包", "三扩展", "wbi签名", "并发", "原子占用", "防重复", "大号小号", "默认小号", "默认账号", "account", "双账号", "绑定顺序", "分清大小号", "交换角色", "bili_accounts", "bili_set_roles", "accounts.json", "main_cookie", "收件箱", "私信", "投币", "点赞", "收藏", "三连", "每日上限", "护栏", "审计", "限流", "bili-cli", "inbox", "dm", "coin", "favorite", "triple", "榜单", "每周必看", "入站必刷", "创作数据", "直播间观众", "活跃观众", "关注观众", "live_viewers", "人气", "去重", "DYN_DUP", "DM_DUP"]
