[plugin]
id = "bili_viewer"
name = "B站全能助手"
description = "让 YUI 浏览、感知并管理哔哩哔哩：搜索视频/直播/用户，查看视频详情（标题/UP主/时长/播放/弹幕/点赞/分P/标签）、弹幕文本、CC 字幕、B站官方 AI 概要、视频评论，查看直播间信息与实时弹幕（匿名采集），查看 UP主信息与投稿列表；可感知用户当前正在看/用的内容（前台窗口通用感知，识别应用/站点/页面主题，B站视频/直播自动匹配详情）；支持管理自己的账号与稿件（查看/改标题简介标签）。v0.7.26 新增账号关注管理：bili_follow_user（关注 UP主/主播，目标支持 uid 或昵称，按昵称自动搜索解析 uid）与 bili_unfollow_user（取消关注），默认走 YUI 小号，同一 uid 60 秒限 1 次防误操作，成功后回复标准短句'已关注。'/'已取消关注。'且 delivery=silent 不主动播报。v0.7.25 扩展升 0.2.13（ScriptProcessorNode 已废弃，音频采集升级为 AudioWorkletNode——独立音频线程，弃用警告消除、稳定性提升）；v0.7.24 扩展升 0.2.12（修复声音捕获导致用户本机声音消失）：tabCapture 捕获标签页音频会把源标签页静音，之前回放链路走 AudioContext destination 且缺 AUDIO_PLAYBACK 豁免，用户听到视频声音消失——现改为 audio 元素直连回放捕获流（低延迟、不依赖 AudioContext 状态），分析链路（ScriptProcessor→ASR）与回放分离，offscreen 声明 reasons: [USER_MEDIA, AUDIO_PLAYBACK]；用户本机声音恢复，YUI 同时可听到并转写。v0.7.23 扩展 0.2.11 修复声音 0 推送的最终根因：offscreen 的 AudioContext 在非用户手势下创建后被 Chrome 自动播放策略置为 suspended——从创建起从未 resume，ScriptProcessor 永远不产出音频数据，所以扩展一直推 enabled=True 却一条音频段都推不出来（YUI 永远听不到声音）。现创建后立即 resume、每段推送前再检查一次 suspended 并重试 resume。v0.7.22 写操作结果全部标记 delivery=silent（机器级静默）：发弹幕/发评论/发动态/改稿件/提审稿件成功的 result 都带 meta.agent.delivery=silent，N.E.K.O 不再中断主 AI 主动播报结果——YUI 不再可能主动冒出'那个B站相关的任务已经搞定啦'这类完成话术（之前 v0.7.13/16/20 三层文本禁令都被 LLM 改写绕过，这次从宿主通道层物理阻断；玩家主动询问时才在对话里回答）。v0.7.21 修复'插件给的和我看的视频不同步'（扩展三包 0.2.10）：v0.7.17 引入的'窗口焦点门控'导致你切到 N.E.K.O 聊天窗口时浏览器失焦、扩展停止推送标签/DOM/画面实况，YUI 感知停在切窗前的旧视频——现移除实况推送的焦点门控（失焦仍持续推送当前活动标签），tab/dom/shot/cookie 推送体统一带 source 标记（EXT_SOURCE），插件按最近一次 cookie 来源（绑定浏览器）过滤标签页，Chrome/Edge/360 多扩展并存也不会互相覆盖。v0.7.20 自主运营'全程静默'纪律置顶强化：自主运营唤醒上下文第一句即锁死——执行前、执行中、执行后都不向玩家发送任何消息、不弹气泡、不汇报结果；工具标准短句（如'弹幕已发送。'）仅在玩家明确询问时才可逐字转述；权限/风控问题才可在下次自然对话简短求助。v0.7.19 修复 ASR worker 事件唤醒根因：_asr_worker_evt 运行时从无人 set（只有测试手动 set）导致 worker 常眠、转写从不发生——每个新声音段到达与 worker 启动都唤醒一次，转写真正开始；同时统一 logger 命名到宿主日志命名空间，web_ui 六通道日志与 ASR 转写日志真正落盘。v0.7.18 修复声音链路致命 bug（听不到声音的又一根因）：ASR 后台锁 _asr_lock 的存储属性与锁方法同名，首次收到声音段调用 _kick_asr 时 getattr 取到 bound method 自身，with 语句抛 \"'method' object does not support the context manager protocol\"——音频虽成功落盘 wav，但 ASR worker 永远无法启动、转写永不发生，YUI 因此长期听不到内容。已改锁存储属性为 _asr_lock_obj 并补回归测试（真实触发 _kick_asr 两次，验证锁可复用、worker 线程正常启动）。v0.7.17 扩展实况推送加'窗口焦点门控'+接收链路日志（扩展三包 0.2.9）：修复双浏览器共存时 Chrome/Edge 各自把'活动标签'实况推给插件互相覆盖、导致 YUI 感知错位的根因——新增窗口焦点门控，只有前台窗口的浏览器才推送标签/DOM/画面实况，cookie 同步与声音捕获不受限制（后台照常工作）；修复 /api/extension-audio-state 路由被 /api/extension-audio 前缀吞掉的 bug（声音开关状态此前永远被判为'声音数据为空或格式异常'）；本地面板 8765 各扩展通道（cookie/tab/dom/shot/audio-state/audio）新增接收日志，声音链路问题可按日志精确定位。v0.7.16 完成话术机器阻断（感知层收口）：排查发现'任务搞定啦'类话术仍会从感知/查询路径漏出（后台分析调用 run 入口感知内容后 YUI 把感知当'任务'汇报）——现对全部感知路径做输出级收口：内部感知上下文、bili_now_watching、entry_run 感知分支输出与描述、bili_see_screen/see_live/see_video 描述全部明确声明'这不是任务/感知实况，严禁任务完成/搞定啦/完成啦/已确认等完成话术与汇报腔'，感知工具结果文本直接携带禁令（生成时刻上下文内阻断）。v0.7.15 声音捕获改为'永久开启+后台'（扩展三包 0.2.8）：默认开启并记忆（从未设置过即视为开、用户显式关闭过才保持关），重启浏览器自动恢复；修复'开关一直关闭'根因——旧版当前标签不在 B站 页时 startAudioCapture 直接抛错导致开关永远开不起来，现改为记住开关意图、切到 B站 标签自动启动，标签切换/URL 变化自动重绑捕获（tabCapture 一次只捕获一个标签）；后台静默不抢界面，仅在浏览器顶部出现'正在捕获标签页'提示（属浏览器正常行为）。v0.7.14 修复'听不到声音'根因：N.E.K.O 打包运行时（projectneko_server.exe）不含 faster-whisper，进程内 ASR 此前必然静默失败——现改为外部 Python 常驻转写桥（asr_bridge.py，优先 BILI_ASR_PYTHON 环境变量/开发 venv，自动探测、崩溃冷却自愈、找不到解释器时静默降级），让 YUI 真正听到直播/视频声音；新增声音捕获状态回显：扩展三包（0.2.7）把声音开关状态推送到面板，bili_listen_audio 听不到时只如实说'暂时没有听到声音。'并在 result 给出链路诊断（开关未开启/从未收到音频/无声或过期），便于精准定位；声音工具纪律同步收紧：严禁'喵/喵呜'语气词开头、严禁猜测原因（是不是主播没说话/静音了）、严禁复述别人刚说过的话、没人问不主动汇报。v0.7.13 完成话术硬约束：发弹幕/评论/动态/改稿/投稿等全部写工具成功后，回复必须逐字原样只输出工具标准短句（'弹幕已发送。'/'评论已发送。'/'动态已发布。'/'稿件已修改。'/'稿件已提交审核。'），纪律置顶为工具描述最高优先项，明令禁止'喵/搞定/任务搞定啦/完成啦/做好啦/发出去了/发出去啦/任务完成'等一切口语化完成话术、表情与开场白；自主运营唤醒上下文同步加入完成话术黑名单；工具输出文案统一为标准短句（细节放 result 字段）。v0.7.12 全盘复查优化：修复声音采样率隐患（AudioContext 不支持 16k 构造参数时按实际采样率写 wav 头与推送字段，ASR 不再听到变速内容）；扩展内核过旧（Chromium<109 无 offscreen）时声音能力自动降级静默跳过、不影响其余功能；登录态自愈加重绑冷却（60s），避免连环失败反复触发后台探测；扩展三包升级 0.2.6。v0.7.11 让 YUI 能真正'看到+听到'：浏览器扩展新增声音捕获（Chrome/Edge/360 三包，popup 一次性开启后后台静默采集 B站 标签页音频，开关记忆重启自动恢复），声音分段 wav 直推本机插件，本地 faster-whisper ASR 转文字后经 bili_listen_audio 静默注入 YUI（全本地处理不上外网）；配合既有扩展画面截图（bili_see_screen）与页面 DOM 实况，YUI 可自主理解视频/直播内容并行动；网络层自动重试+写操作随机抖动防拦截（网络错误/超时/5xx 自动退避重试，高频写请求时间抖动降低被风控概率）；登录态失效自动自愈（写操作 AUTH_FAILED 时后台触发重绑，扩展在线自动同步新登录态）；桌面投放扩展包同步新增 offscreen 声音采集文件。v0.7.10 双账号分清大小号：绑定流程按登录顺序自动归位——第一个登录的账号=大号（main），第二个登录的账号=小号（yui，默认操作账号），持久化到插件目录 main_cookie.txt/yui_cookie.txt 并记录账号角色映射（accounts.json）；新增 bili_accounts（大小号昵称/uid/绑定时间/默认角色视图，YUI 随时分清大小号）与 bili_set_roles（后期说明修改：交换大小号角色或按 uid 指定角色，仅文件层绑定账号可互换，env 优先时提示手动）；CDP/扩展/面板三个绑定通道全部走统一归位逻辑。v0.7.9 默认小号统一规则：未说明用哪个账号时所有账号维度操作一律默认走 YUI 小号（小号未配置自动回退主账号），账号解析统一 _resolve_account，bili.py 底层 edit_video/my_info/my_videos 支持 account 参数默认 yui。v0.7.8 大号小号并发防打架：小号写操作节流锁内原子占用消除并发双发、失败自动回退、投稿进行中互斥（BUSY）、凭证完全按账号隔离。v0.7.7 三扩展命名对称；v0.7.6 稿件修改/投稿提交补 wbi 签名；v0.7.5 桌面投放三扩展压缩包；v0.7.4 扩展按浏览器拆分三包独立；v0.7.3 动态 wbi 签名、Cookie mtime 缓存、-101 归口；v0.7.1 独立小号后台化（同步+自主行动，静默不抢界面、仅权限问题求助）；自主行动节流：弹幕 60s/目标、评论 120s/目标、动态 6 条/日、投稿 2 条/日、风控自动退避。绑定 CDP 运行时接入，Cookie 仅本地使用不上传不写日志。"
short_description = "让 YUI 浏览、感知并管理 B站：搜索/视频详情/弹幕/字幕/AI概要/评论/直播弹幕/UP主/稿件管理/发弹幕/写评论/发动态/投稿/独立小号后台自主运营（第一个登录=大号、第二个登录=小号，YUI 分清大小号，可后期互换）/感知当前观看/扩展直连自动绑定（Chrome/Edge/360 三浏览器专用扩展，桌面自动投放三扩展压缩包；v0.7.17 起实况推送带窗口焦点门控，多浏览器共存以你正在看的那一个为准）+声音感知：扩展后台采集 B站 标签页声音（永久开启+记忆、不在 B站 页自动记住意图、标签切换自动重绑；外部 Python 常驻 ASR 桥转写，绕过打包环境缺 faster-whisper 的坑；v0.7.17 修复声音开关状态被路由吞掉、各扩展通道新增接收日志可精确定位；v0.7.18 修复 ASR 锁同名 bug——音频落盘后 worker 可启动；v0.7.19 修复 ASR worker 唤醒事件运行时从不触发——这是听不到声音的完整根因链最后一环，现在音频到达即唤醒转写真正开始，且插件内部日志统一命名真正落盘可秒级定位），让 YUI 真正听到直播与视频（全本地处理，采样率自适应）+网络重试与写操作抖动防拦截+AUTH_FAILED 自动重绑自愈+完成话术硬约束（成功后只回'弹幕已发送。'等标准短句，严禁'搞定/任务完成'话术；感知/查询路径全部输出级声明'不是任务'；听不到声音时只如实说明不猜测）"
keywords = ["bilibili", "哔哩哔哩", "B站", "视频", "弹幕", "评论", "直播", "字幕", "AI概要", "UP主", "搜索", "bili", "danmaku", "live", "感知", "now_watching", "稿件", "发弹幕", "写评论", "动态", "投稿", "独立小号", "YUI运营", "自主行动", "后台静默", "不抢界面", "同步行动", "当前观看", "CDP", "自动绑定", "cookie", "浏览器扩展", "bili-bridge", "bili-bridge-chrome", "接入桥", "直连", "实时监控", "标签页感知", "Edge扩展", "360浏览器", "360极速", "360安全", "chrome扩展", "桌面投放", "zip压缩包", "三扩展", "wbi签名", "并发", "原子占用", "防重复", "大号小号", "默认小号", "默认账号", "account", "双账号", "绑定顺序", "分清大小号", "交换角色", "bili_accounts", "bili_set_roles", "accounts.json", "main_cookie"]
