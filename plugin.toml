[plugin]
id = "bili_viewer"
name = "B站全能助手"
description = "让 YUI 浏览、感知并管理哔哩哔哩：搜索视频/直播/用户，查看视频详情（标题/UP主/时长/播放/弹幕/点赞/分P/标签）、弹幕文本、CC 字幕、B站官方 AI 概要、视频评论，查看直播间信息与实时弹幕（匿名采集），查看 UP主信息与投稿列表；可感知用户当前正在看/用的内容（前台窗口通用感知，识别应用/站点/页面主题，B站视频/直播自动匹配详情）；支持管理自己的账号与稿件（查看/改标题简介标签）与直播时回复弹幕（写操作需绑定 B站登录态）。登录态绑定采用 CDP 运行时接入：直接读取正在运行的浏览器（Chrome/Edge）中的 B站登录态，无需关闭浏览器，也不要求手动复制 Cookie；Cookie 仅本地使用，不上传、不写日志。"
short_description = "让 YUI 浏览、感知并管理 B站：搜索/视频详情/弹幕/字幕/AI概要/评论/直播弹幕/UP主/稿件管理/发弹幕/感知当前观看/扩展直连自动绑定"
keywords = ["bilibili", "哔哩哔哩", "B站", "视频", "弹幕", "评论", "直播", "字幕", "AI概要", "UP主", "搜索", "bili", "danmaku", "live", "感知", "now_watching", "稿件", "发弹幕", "当前观看", "CDP", "自动绑定", "cookie", "浏览器扩展", "bili-bridge", "接入桥", "直连"]
version = "0.6.9"
type = "plugin"
entry = "plugin.plugins.bili_viewer:BiliViewerPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
