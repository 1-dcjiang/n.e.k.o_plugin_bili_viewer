[plugin]
id = "bili_viewer"
name = "B站全能助手"
description = "让 YUI 浏览、感知并管理哔哩哔哩：搜索视频/直播/用户，查看视频详情（标题/UP主/时长/播放/弹幕/点赞/分P/标签）、弹幕文本、CC 字幕、B站官方 AI 概要、视频评论，查看直播间信息与实时弹幕（匿名采集），查看 UP主信息与投稿列表；可感知用户当前正在看/用的内容（前台窗口通用感知，识别应用/站点/页面主题，B站视频/直播自动匹配详情）；支持管理自己的账号与稿件（查看/改标题简介标签）。v0.7.8 大号小号并发防打架：所有小号写操作（直播弹幕/视频弹幕/评论/动态/投稿）的节流改为锁内原子占用（check+mark 一体），彻底消除两个线程同时通过检查导致的并发双发；发送失败/去重命中自动回退占用，不会误限流；投稿增加进行中互斥（同一时刻仅一个上传流程，并发请求返回 BUSY，天级计数不被并发突破）；凭证/CSRF 完全按账号隔离（每次实时解析，无跨账号缓存），大号与小号可同时运行互不干扰。v0.7.7 三扩展命名对称：Chrome 版目录 bili-bridge-chrome、显示名「B站接入桥 (Chrome)」、source bili-bridge-chrome-extension（三包 0.2.4，Edge/360 与 Chrome 仅标识差异）。v0.7.6 稿件修改/投稿提交补 wbi 签名（防 -352）。v0.7.5 桌面投放三扩展压缩包 zip（插件每次加载更新到桌面）；v0.7.4 接入桥扩展按浏览器拆分三包独立；v0.7.3 动态接口补 wbi 签名、小号 Cookie mtime 缓存、-101 归口、multipart 清洗、Edge 兜底；v0.7.2 热门拉取 60s 缓存；v0.7.1 独立小号完全后台化（同步行动+自行行动，后台静默注入不弹气泡不抢界面、行动成功不播报、仅权限问题求助）；自主行动节流：弹幕 60s/目标、评论 120s/目标、动态 6 条/日、投稿 2 条/日、投稿分片限速、风控自动退避。登录态绑定 CDP 运行时接入（Chrome/Edge），Cookie 仅本地使用不上传不写日志。"
short_description = "让 YUI 浏览、感知并管理 B站：搜索/视频详情/弹幕/字幕/AI概要/评论/直播弹幕/UP主/稿件管理/发弹幕/写评论/发动态/投稿/独立小号后台自主运营（大号小号并发不打架）/感知当前观看/扩展直连自动绑定（Chrome/Edge/360 三浏览器专用扩展，桌面自动投放三扩展压缩包）"
keywords = ["bilibili", "哔哩哔哩", "B站", "视频", "弹幕", "评论", "直播", "字幕", "AI概要", "UP主", "搜索", "bili", "danmaku", "live", "感知", "now_watching", "稿件", "发弹幕", "写评论", "动态", "投稿", "独立小号", "YUI运营", "自主行动", "后台静默", "不抢界面", "同步行动", "当前观看", "CDP", "自动绑定", "cookie", "浏览器扩展", "bili-bridge", "bili-bridge-chrome", "接入桥", "直连", "实时监控", "标签页感知", "Edge扩展", "360浏览器", "360极速", "360安全", "chrome扩展", "桌面投放", "zip压缩包", "三扩展", "wbi签名", "并发", "原子占用", "防重复", "大号小号"]
version = "0.7.8"
type = "plugin"
entry = "plugin.plugins.bili_viewer:BiliViewerPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
