[plugin_runtime]
enabled = true
auto_start = true

# ── B站账号接入（推荐方式：自动绑定）────────────────────────────
# 推荐让 YUI 自动读取本机浏览器（Chrome/Edge）已登录的 B站 Cookie 并绑定：
#   1. 先在浏览器里登录一次 bilibili.com（扫码/账号均可）
#   2. 对 YUI 说"允许你读取浏览器 Cookie 绑定 B站账号"，YUI 会调用 bili_bind_account(allow=true)
#   3. 浏览器进程常驻导致 Cookie 被锁时，可对 YUI 说"允许自动关闭浏览器并绑定"，
#      插件会自动结束 chrome.exe/msedge.exe 再重试（会关闭浏览器窗口，需你明确同意）
#   4. 或手动在任务管理器结束 Chrome/Edge 进程后重启 N.E.K.O 客户端
# 自动读取为本地操作，Cookie 不上传、不写日志、不发给 AI。
#
# ── 手动配置（备选）────────────────────────────────────────────
# 也可把浏览器 F12 → Application → Cookies → bilibili.com 复制的整串 Cookie
# 直接填到下方 bili_cookie = "..."（含 SESSDATA；发弹幕/改稿件还需 bili_jct）。
# 手动配置优先级高于自动读取。
[settings]
bili_cookie = ""
# 是否允许插件自动读取浏览器 Cookie（true=允许；YUI 询问时回复"允许"即可自动置为 true）
allow_cookie_scan = false
